name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  a11y:
    runs-on: ubuntu-latest
    needs: build-and-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server and run a11y tests
        run: |
          npx serve dist -l 8080 &
          # Wait for server to be ready
          timeout 30 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 1; done'
          npm run lint:a11y

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-lint, a11y]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Wait for deployment to propagate
        run: sleep 10

      - name: Verify HTML page loads
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ needs.deploy.outputs.page_url }}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Homepage returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Homepage OK (HTTP 200)"

      - name: Verify CSS loads
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ needs.deploy.outputs.page_url }}css/style.css")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "CSS returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "CSS OK (HTTP 200)"

      - name: Verify page contains expected content
        run: |
          CONTENT=$(curl -s "${{ needs.deploy.outputs.page_url }}")
          if ! echo "$CONTENT" | grep -q "Airfoils"; then
            echo "Page doesn't contain expected content"
            exit 1
          fi
          echo "Content check OK"
