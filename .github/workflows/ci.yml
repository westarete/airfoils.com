name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Start server
        run: |
          npx serve dist -l 8080 &
          timeout 30 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 1; done'

      - name: Check links
        run: npm run lint:links

      - name: Check accessibility
        run: npm run lint:a11y

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Wait for deployment to propagate
        run: sleep 10

      - name: Verify page loads with no broken resources
        run: |
          # Fetch the page and check for 200
          HTTP_STATUS=$(curl -s -o /tmp/page.html -w "%{http_code}" "${{ needs.deploy.outputs.page_url }}")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Homepage returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Homepage OK (HTTP 200)"
          
          # Extract CSS URLs and verify they load
          BASE_URL="${{ needs.deploy.outputs.page_url }}"
          CSS_URLS=$(grep -oP 'href="\K[^"]*\.css' /tmp/page.html || true)
          for css in $CSS_URLS; do
            # Handle relative URLs
            if [[ "$css" == /* ]]; then
              ORIGIN=$(echo "$BASE_URL" | sed 's|\(https\?://[^/]*\).*|\1|')
              FULL_URL="${ORIGIN}${css}"
            else
              FULL_URL="${BASE_URL}${css}"
            fi
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FULL_URL")
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "CSS $FULL_URL returned HTTP $HTTP_STATUS"
              exit 1
            fi
            echo "CSS OK: $FULL_URL"
          done

      - name: Verify page contains expected content
        run: |
          CONTENT=$(curl -s "${{ needs.deploy.outputs.page_url }}")
          if ! echo "$CONTENT" | grep -q "Airfoils"; then
            echo "Page doesn't contain expected content"
            exit 1
          fi
          echo "Content check OK"
